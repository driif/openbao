syntax = "proto3";

package forwarding;

import "google/protobuf/struct.proto";

option go_package = "github.com/openbao/openbao/helper/forwarding";

// ForwardedHeader represents HTTP-like headers with possible multiple string values per key.
message ForwardedHeader {
    map<string, StringArray> header = 1;
}

message StringArray {
    repeated string values = 1;
}

// ForwardedSecret mirrors parts of logical.Secret structure.
message ForwardedSecret {
    google.protobuf.Struct data = 1;         // dynamic data map (corresponds to InternalData)
    int64 ttl = 2;                           // seconds from embedded LeaseOptions.TTL
    string lease_id = 3;                     // LeaseID
    bool renewable = 4;                      // from embedded LeaseOptions.Renewable
    string display_name = 5;                 // DisplayName field exists in logical.Secret?
}

// ForwardedAuth mirrors parts of logical.Auth.
message ForwardedAuth {
    string client_token = 1;
    string accessor = 2;
    string display_name = 3;
    repeated string policies = 4;                              // Policies
    map<string, string> metadata = 5;
    int64 lease_duration = 6;                                  // TTL from LeaseOptions (seconds)
    bool renewable = 7;                                        // LeaseOptions
    string entity_id = 8;
    string token_type = 9;                                     // string version of TokenType
    int64 num_uses = 10;
    int64 explicit_max_ttl = 11;
    int64 period = 12;
    repeated string identity_policies = 13;
    map<string, StringArray> external_namespace_policies = 14;
}

// ForwardedConnectionInfo minimally captures remote address.
message ForwardedConnectionInfo {
    string remote_addr = 1;
}

// ForwardedRequestWrapper carries JSON serialized wrapper info.
message ForwardedRequestWrapper {
    bytes serialized_wrapper_info = 1;  // JSON serialized RequestWrapper
}

// ForwardedLogicalRequest mirrors parts of logical.Request.
message ForwardedLogicalRequest {
    string path = 1;
    string operation = 2;
    google.protobuf.Struct data = 3;                      // dynamic request data map
    map<string, string> forward_meta = 4;
    string client_token = 5;
    ForwardedHeader headers = 6;
    ForwardedRequestWrapper wrap_info = 7;
    ForwardedConnectionInfo connection = 8;
    string entity_id = 9;
    string display_name = 10;
    bool unauthenticated = 11;
    bytes mfa_creds = 12;
    bytes login_mfa = 13;
    bytes quota_request = 14;
}

// ForwardedResponseWrapInfo mirrors wrapping.ResponseWrapInfo.
message ForwardedResponseWrapInfo {
    string token = 1;
    int64 ttl = 2;               // seconds
    string format = 3;
    string creation_path = 4;
    bool seal_wrap = 5;
    string wrapped_accessor = 6;
}

// ForwardedLogicalResponse mirrors parts of logical.Response.
message ForwardedLogicalResponse {
    ForwardedSecret secret = 1;
    ForwardedAuth auth = 2;
    google.protobuf.Struct data = 3;                       // dynamic response data map
    string redirect = 4;
    repeated string warnings = 5;
    ForwardedResponseWrapInfo wrap_info = 6;
    bytes mfa_login_response = 7;
    bytes quota_error_response = 8;
}

service ForwardingService {
    rpc ForwardLogicalRequest(ForwardedLogicalRequest) returns (ForwardedLogicalResponse);
}
